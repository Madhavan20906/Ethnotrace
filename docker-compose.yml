version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethnotrace-backend
    ports:
      - "8000:8000"
    environment:
      - ETHNOTRACE_DATABASE_URL=postgresql://ethnotrace:ethnotrace_password@postgres:5432/ethnotrace_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ethnotrace_secret
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - neo4j
      - qdrant
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ethnotrace-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: ethnotrace-postgres
    environment:
      POSTGRES_USER: ethnotrace
      POSTGRES_PASSWORD: ethnotrace_password
      POSTGRES_DB: ethnotrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    container_name: ethnotrace-neo4j
    environment:
      NEO4J_AUTH: neo4j/ethnotrace_secret
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ethnotrace-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
